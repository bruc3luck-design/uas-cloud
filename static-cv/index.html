<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta
      name="description"
      content="Founder-grade personal SaaS landing page for Catur Prasetiyo Gama, positioned as an AI engineer, product designer, and SaaS builder."
    />
    <meta
      name="keywords"
      content="Catur Prasetiyo Gama, AI Engineer, SaaS Builder, Product Designer, Landing Page"
    />
    <title>Catur Prasetiyo Gama | AI Engineer & SaaS Builder</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Manrope:wght@400;500;600;700;800&family=Space+Grotesk:wght@500;700&display=swap"
      rel="stylesheet"
    />
    <link rel="stylesheet" href="./styles/landing.css" />
  </head>
  <body>
    <div class="noise-layer" aria-hidden="true"></div>
    <div class="bg-orb bg-orb-one" aria-hidden="true"></div>
    <div class="bg-orb bg-orb-two" aria-hidden="true"></div>
    <div class="bg-grid" aria-hidden="true"></div>

    <header class="site-header">
      <div class="container header-shell">
        <a class="brand-mark" href="#hero">Catur Prasetiyo Gama</a>
        <nav class="site-nav" aria-label="Primary navigation" id="site-nav"></nav>
      </div>
    </header>

    <main>
      <section class="hero-section section" id="hero">
        <div class="container hero-layout">
          <div class="hero-copy reveal">
            <div class="eyebrow-pill" id="hero-announcement"></div>
            <p class="section-kicker" id="hero-title"></p>
            <h1 class="hero-heading">
              <span id="hero-name"></span>
              <span class="gradient-text" id="hero-tagline"></span>
            </h1>
            <p class="hero-description" id="hero-description"></p>
            <div class="hero-actions" id="hero-actions"></div>
            <div class="stats-grid" id="stats-grid"></div>
          </div>

          <div class="hero-visual reveal" id="hero-visual">
            <div class="floating-pill" id="floating-eyebrow"></div>
            <div class="glass-card hero-card">
              <div class="hero-image-shell">
                <div class="hero-image-frame">
                  <img id="hero-image" alt="Profile portrait" />
                </div>
              </div>
              <div class="glass-card inner-card">
                <div class="inner-card-header">
                  <div>
                    <p class="mini-kicker" id="floating-mini-kicker"></p>
                    <h2 id="floating-title"></h2>
                  </div>
                  <div class="orbit-badge" aria-hidden="true">
                    <span></span>
                  </div>
                </div>
                <p class="card-copy" id="floating-description"></p>
                <div class="social-pills" id="hero-socials"></div>
              </div>
            </div>
          </div>
        </div>
      </section>

      <section class="section" id="about">
        <div class="container">
          <div class="section-heading reveal" id="about-heading"></div>
          <div class="about-grid">
            <article class="glass-card reveal" id="about-long"></article>
            <aside class="glass-card reveal" id="about-stats"></aside>
          </div>
        </div>
      </section>

      <section class="section" id="education">
        <div class="container">
          <div class="section-heading reveal" id="education-heading"></div>
          <div class="stack-grid" id="education-grid"></div>
        </div>
      </section>

      <section class="section" id="skills">
        <div class="container">
          <div class="section-heading reveal" id="skills-heading"></div>
          <div class="card-grid three-up" id="skills-grid"></div>
        </div>
      </section>

      <section class="section" id="portfolio">
        <div class="container">
          <div class="section-heading reveal" id="portfolio-heading"></div>
          <div id="featured-project"></div>
          <div class="card-grid three-up" id="portfolio-grid"></div>
        </div>
      </section>

      <section class="section" id="experience">
        <div class="container">
          <div class="section-heading reveal" id="experience-heading"></div>
          <div class="stack-grid" id="experience-grid"></div>
        </div>
      </section>

      <section class="section hidden" id="testimonials-section">
        <div class="container">
          <div class="section-heading reveal" id="testimonials-heading"></div>
          <div class="card-grid three-up" id="testimonials-grid"></div>
        </div>
      </section>

      <section class="section" id="contact">
        <div class="container">
          <div class="section-heading reveal" id="contact-heading"></div>
          <div class="contact-grid">
            <article class="glass-card reveal" id="contact-card"></article>
            <aside class="glass-card reveal" id="contact-links"></aside>
          </div>
        </div>
      </section>
    </main>

    <footer class="site-footer">
      <div class="footer-line" aria-hidden="true"></div>
      <div class="container footer-shell">
        <div class="footer-copy">
          <p class="footer-title" id="footer-statement"></p>
          <p class="footer-meta" id="footer-identity"></p>
          <p class="footer-meta" id="footer-copyright"></p>
        </div>
        <div class="footer-links" id="footer-links"></div>
      </div>
    </footer>

    <script src="./script.js"></script>
  </body>
</html>
